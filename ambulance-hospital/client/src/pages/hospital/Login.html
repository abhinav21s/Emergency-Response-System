<!DOCTYPE html>
<html>
  <head>
    <title>Hospital Login - Justice Emergency</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background: linear-gradient(135deg, #020617 0%, #0f1c4d 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e2e8f0;
      }
      .login-container {
        background-color: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        overflow: hidden;
        width: 100%;
        max-width: 450px;
        padding: 30px;
      }
      .login-header {
        color: white;
        padding-bottom: 20px;
        text-align: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        margin-bottom: 25px;
      }
      h1 {
        font-weight: 700;
        font-size: 28px;
        margin-bottom: 5px;
        color: white;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      }
      .form-group {
        margin-bottom: 24px;
      }
      label {
        font-weight: 500;
        color: #e2e8f0;
        margin-bottom: 8px;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
      }
      .form-control {
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 12px 15px;
        border-radius: 8px;
        background-color: rgba(255, 255, 255, 0.07);
        color: white;
        transition: all 0.3s ease;
      }
      .form-control:focus {
        border-color: rgba(78, 115, 223, 0.5);
        box-shadow: 0 0 15px rgba(78, 115, 223, 0.3);
        background-color: rgba(255, 255, 255, 0.1);
      }
      .btn-primary {
        background: rgba(78, 115, 223, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 12px;
        font-weight: 600;
        letter-spacing: 0.5px;
        border-radius: 8px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }
      .btn-primary:hover {
        background: rgba(78, 115, 223, 0.95);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        transform: translateY(-2px);
      }
      .icon-container {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 70px;
        height: 70px;
        background-color: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        margin: 0 auto 15px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
      }
      .hospital-icon {
        font-size: 36px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
      .input-group-text {
        background-color: rgba(78, 115, 223, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-right: none;
        color: white;
      }
      .input-group .form-control {
        border-left: none;
      }
      .form-check-label {
        color: #e2e8f0;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <div class="icon-container">
          <span class="hospital-icon">🏥</span>
        </div>
        <h1>Hospital Login</h1>
        <p class="mb-0">Justice Emergency Response System</p>
      </div>
      <div class="login-body">
        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-group">
              <span class="input-group-text">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                  <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                </svg>
              </span>
              <input type="email" class="form-control" id="email" name="email" required placeholder="Enter your email">
            </div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-group">
              <span class="input-group-text">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                  <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
                </svg>
              </span>
              <input type="password" class="form-control" id="password" name="password" required placeholder="Enter your password">
            </div>
          </div>
          <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="rememberMe">
            <label class="form-check-label" for="rememberMe">Remember me</label>
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
      </div>
    </div>
    <script>
      document.querySelector('form').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        fetch('http://localhost:5001/api/auth/login/hospital', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        })
        .then(response => response.json())
        .then(data => {
          if (data.token) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('hospital_token', data.token);
            localStorage.setItem('user', JSON.stringify(data));
            window.location.href = '/hospital/dashboard';
          } else {
            alert('Login failed: ' + (data.message || 'Invalid credentials'));
          }
        })
        .catch(error => {
          alert('Login error: ' + error.message);
        });
      });
    </script>
  </body>
</html>
