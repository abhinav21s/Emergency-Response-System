version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: justice_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: justice_server
    depends_on:
      - mongo
    environment:
      - NODE_ENV=development
      - PORT=5001
      - CLIENT_URL=http://localhost:3000
      - MONGO_URI=mongodb://mongo:27017/justice_db
      - JWT_SECRET=${JWT_SECRET:-justice_emergency_response_system_secret_key}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
    ports:
      - "5001:5001"
    # If you want live-reload with nodemon inside container, uncomment volumes and change command
    # volumes:
    #   - ./server:/app
    # command: ["npm", "run", "dev"]

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: justice_client
    depends_on:
      - server
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
    ports:
      - "3000:3000"
    # volumes:
    #   - ./client:/app
    #   - /app/node_modules

volumes:
  mongo_data:
